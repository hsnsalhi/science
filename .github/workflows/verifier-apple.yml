# Teste les identifiants App Store Connect, sans rien construire.
#
# Un refus d'authentification ne se manifeste sinon qu'à la toute fin du
# workflow TestFlight, après cinq minutes de compilation et au prix d'un
# numéro de build définitivement consommé. Ce workflow-ci pose la même
# question à Apple en une minute, et ne consomme rien.
#
# Il interroge directement l'API d'App Store Connect : `altool
# --list-providers`, le test habituel, n'accepte pas l'authentification par
# clé d'API et répond « list-providers does not support APIKey
# authentication » quels que soient les identifiants fournis.
name: Vérifier les identifiants Apple

on:
  workflow_dispatch:

jobs:
  verifier:
    name: Interroger App Store Connect
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Interroger l'API avec la clé
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -uo pipefail

          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret manquant : $name"
              exit 1
            fi
          done

          KEY_FILE="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          python3 tool/ios_signing.py check-asc \
            --asc-key "$KEY_FILE" \
            --issuer "$ASC_ISSUER_ID" \
            --key-id "$ASC_KEY_ID" \
            --builds com.techlyb.eureka
          status=$?

          rm -f "$KEY_FILE"
          if [ $status -ne 0 ]; then
            echo "::error::Apple refuse ces identifiants — voir ci-dessus."
          else
            echo "::notice::Identifiants valides, le workflow TestFlight peut être relancé."
          fi
          exit $status
