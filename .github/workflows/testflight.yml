# Construit Eurêka pour iOS et l'envoie sur TestFlight.
#
# Ce dépôt n'a pas besoin d'un Mac : le travail tourne sur un runner macOS
# fourni par GitHub. Le déclenchement est **manuel** (onglet Actions →
# TestFlight → Run workflow), volontairement : chaque exécution consomme un
# numéro de build côté App Store Connect, qui ne peut jamais être réutilisé.
#
# Secrets attendus dans Settings → Secrets and variables → Actions.
# La procédure pour les obtenir est dans docs/TESTFLIGHT.md.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Notes affichées aux testeurs TestFlight
        required: false
        default: Build de test.

# Deux envois simultanés se disputeraient le même numéro de build.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    name: Construire et envoyer
    # Apple refuse depuis 2026 tout envoi construit avec un SDK antérieur à
    # iOS 26, livré par Xcode 26. L'image macos-15 s'arrête à Xcode 16.4 : le
    # build réussissait, et Apple le rejetait à la validation. macos-26 porte
    # Xcode 26, et l'étape suivante vérifie qu'il est bien sélectionné plutôt
    # que de laisser la surprise arriver après dix minutes de compilation.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Vérifier que tous les secrets sont présents
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD \
                      IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID \
                      ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Secrets manquants : ${missing[*]}"
            echo "Voir docs/TESTFLIGHT.md pour savoir comment les obtenir."
            exit 1
          fi

          # Contrôle de forme des identifiants App Store Connect. Mal copiés,
          # ils ne se manifestent qu'au téléversement, après plusieurs minutes
          # de build, par un « Cannot verify client's JWT headers » qui ne
          # nomme pas le champ fautif.
          if ! printf '%s' "$ASC_ISSUER_ID" | grep -Eq \
              '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "::error::ASC_ISSUER_ID n'est pas un UUID (longueur ${#ASC_ISSUER_ID})."
            echo "Attendu : la valeur « Issuer ID » en haut de"
            echo "https://appstoreconnect.apple.com/access/integrations/api"
            exit 1
          fi
          if ! printf '%s' "$ASC_KEY_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::ASC_KEY_ID doit faire dix caractères (longueur ${#ASC_KEY_ID})."
            exit 1
          fi
          if ! printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode \
               | head -1 | grep -q 'BEGIN PRIVATE KEY'; then
            echo "::error::ASC_PRIVATE_KEY_BASE64 ne contient pas une clé PKCS#8."
            exit 1
          fi

          echo "Tous les secrets sont présents et bien formés."

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # La version d'Xcode par défaut de l'image n'est pas garantie : on
      # choisit explicitement la plus récente installée, et on s'arrête ici
      # si elle est trop ancienne pour qu'Apple accepte l'envoi.
      - name: Sélectionner Xcode
        run: |
          set -euo pipefail
          LATEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$LATEST"
          echo "Xcode retenu : $LATEST"
          # xcodebuild écrit sa version puis continue : fermer le tube avec
          # « head » lui vaut un SIGPIPE, qu'il transforme en exception et en
          # code 134. On capture la sortie entière avant de la découper.
          VERSION="$(xcodebuild -version)"
          MAJOR="$(printf '%s\n' "$VERSION" | sed -n '1s/[^0-9]*\([0-9][0-9]*\).*/\1/p')"
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Xcode $MAJOR installé, Apple exige Xcode 26 ou plus."
            echo "Versions présentes : $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi

      - name: Versions de l'environnement
        run: |
          flutter --version
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          pod --version

      - name: Récupérer les dépendances
        run: flutter pub get

      # Un build cassé envoyé sur TestFlight fait perdre un numéro de build
      # et le temps des testeurs : on vérifie avant de signer quoi que ce soit.
      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Préparer la signature
        id: signing
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail

          # 1. Un trousseau temporaire, propre à cette exécution.
          KEYCHAIN="$RUNNER_TEMP/eureka.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # 2. Le certificat de distribution et sa clé privée.
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$IOS_DIST_CERT_PASSWORD" -A -f pkcs12
          # Contrôle immédiat : un .p12 sans clé privée échouerait bien plus
          # loin, à la signature, avec un message peu parlant.
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"; then
            echo "::error::Aucune identité « Apple Distribution » utilisable dans le .p12."
            echo "Le fichier ne contient probablement pas la clé privée."
            echo "Voir docs/TESTFLIGHT.md, étape 2, ou lancer : python3 tool/ios_signing.py check"
            security find-identity -v "$KEYCHAIN" || true
            exit 1
          fi
          # Sans cette ligne, codesign réclame une autorisation interactive
          # que personne ne peut donner sur un runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046 — la liste doit être redécoupée en mots.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/[\" ]//g')

          # 3. Le profil d'approvisionnement, installé là où Xcode le cherche.
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")"
          BUNDLE_ID="$(plutil -extract Entitlements.application-identifier raw "$RUNNER_TEMP/profile.plist" | cut -d. -f2-)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          echo "Profil « $PROFILE_NAME » pour $BUNDLE_ID"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"

          # 4. Les réglages de signature, lus par Release.xcconfig.
          cat > ios/Flutter/Signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $IOS_TEAM_ID
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          EOF

          # 5. Les options d'export de l'archive.
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          EOF

      # Le numéro de build doit croître à chaque envoi et ne jamais se répéter :
      # `github.run_number` s'incrémente tout seul et ne revient jamais en arrière.
      - name: Construire l'IPA
        run: |
          set -euo pipefail
          flutter build ipa \
            --release \
            --build-number="${{ github.run_number }}" \
            --export-options-plist=ios/ExportOptions.plist
          ls -lh build/ios/ipa/

      - name: Conserver l'IPA comme artefact
        uses: actions/upload-artifact@v5
        with:
          name: eureka-ipa-build-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          retention-days: 14
          if-no-files-found: error

      # Deux leçons des envois précédents. D'abord, altool veut un chemin
      # absolu : avec un chemin relatif il échoue sur « Cannot verify
      # client's JWT headers », un message qui accuse les identifiants alors
      # que la clé est bonne — le workflow « Vérifier Apple » le prouve
      # depuis un runner, avec ces mêmes secrets. Ensuite, iTMSTransporter
      # n'est plus livré dans Xcode : le chercher coûtait deux minutes et
      # demie pour rien, altool reste le seul outil disponible ici.
      - name: Envoyer sur TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -uo pipefail

          KEY_NAME="AuthKey_${ASC_KEY_ID}.p8"
          for dir in "$HOME/private_keys" "$HOME/.private_keys" \
                     "$HOME/.appstoreconnect/private_keys" "$PWD/private_keys"; do
            mkdir -p "$dir"
            echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$dir/$KEY_NAME"
            chmod 600 "$dir/$KEY_NAME"
          done
          export API_PRIVATE_KEYS_DIR="$HOME/private_keys"
          echo "Clé déposée : $(wc -c < "$HOME/private_keys/$KEY_NAME") octets"

          IPA="$(cd build/ios/ipa && ls *.ipa | head -1)"
          IPA="$PWD/build/ios/ipa/$IPA"
          echo "Archive : $IPA"

          echo "── Envoi par altool ──"
          if xcrun altool --upload-app --type ios --file "$IPA" \
               --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"; then
            echo "Téléversé par altool."
            exit 0
          fi

          # Refus d'altool : si c'est l'authentification qui a échoué,
          # reste l'hypothèse du rôle de la clé. Lire la liste des
          # applications ne demande aucun privilège, déposer un build en
          # demande ; on interroge donc des points d'accès aux seuils
          # différents pour nommer la cause dans le journal.
          echo
          echo "── Diagnostic : privilèges de la clé ──"
          python3 tool/ios_signing.py check-asc --probe-upload \
            --asc-key "$HOME/private_keys/$KEY_NAME" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true

          echo "::error::Apple a refusé le téléversement — voir ci-dessus."
          exit 1

      - name: Résumé
        if: success()
        env:
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          {
            echo "### Build envoyé sur TestFlight"
            echo ""
            echo "- Version : \`$(grep '^version:' pubspec.yaml | cut -d' ' -f2)\`"
            echo "- Numéro de build : \`${{ github.run_number }}\`"
            echo "- Notes : $NOTES"
            echo ""
            echo "Le traitement par Apple prend 5 à 20 minutes. Le build"
            echo "apparaît ensuite dans App Store Connect → TestFlight,"
            echo "puis dans l'application TestFlight sur le téléphone."
          } >> "$GITHUB_STEP_SUMMARY"

      # Les secrets déchiffrés ne doivent pas survivre à l'exécution, même en
      # cas d'échec d'une étape précédente.
      - name: Nettoyer les secrets
        if: always()
        run: |
          security delete-keychain "${KEYCHAIN:-}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision" \
                "$RUNNER_TEMP/profile.plist" || true
          rm -rf "$HOME/private_keys" "$HOME/.private_keys" \
                 "$HOME/.appstoreconnect" "$PWD/private_keys" || true
          rm -f ios/Flutter/Signing.xcconfig ios/ExportOptions.plist || true
